
services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      RETINATRIAGE_ALLOWED_ORIGINS: http://localhost:5173
      RETINATRIAGE_FORCE_CPU: "1"
      RETINATRIAGE_MAX_UPLOAD_MB: "10"
    volumes:
      - ./backend/weights:/app/weights:ro
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
